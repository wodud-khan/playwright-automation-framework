name: Quality engineering validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.5"
  PYTHON_VERSION: "3.12.15"

jobs:
  security:
    name: Secret and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all --full-history" --redact=100

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked audit tools
        run: uv sync --locked --group security

      - name: Scan Python source
        run: uv run --frozen bandit -r src scripts conftest.py

      - name: Audit locked runtime, development, and audit dependencies
        run: |
          uv export --locked --extra dev --group security --no-emit-project \
            --format requirements-txt --output-file "$RUNNER_TEMP/requirements-audit.txt" > /dev/null
          uv run --frozen pip-audit -r "$RUNNER_TEMP/requirements-audit.txt" --no-deps --disable-pip

  static-and-unit:
    name: Static analysis and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development dependencies
        run: uv sync --extra dev --locked --python "${PYTHON_VERSION}"

      - name: Verify lock file
        run: uv lock --check

      - name: Collect tests
        run: uv run --frozen pytest --collect-only -q

      - name: Run Ruff lint
        run: uv run --frozen ruff check .

      - name: Check Ruff formatting
        run: uv run --frozen ruff format --check .

      - name: Run Mypy
        run: uv run --frozen mypy src scripts

      - name: Run unit tests with reports
        run: >-
          uv run --frozen pytest tests/unit -q -n 2
          --html=artifacts/unit-report.html
          --self-contained-html
          --junitxml=artifacts/unit-junit.xml

      - name: Upload unit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-reports
          path: |
            artifacts/unit-report.html
            artifacts/unit-junit.xml
          if-no-files-found: warn
          retention-days: 14

  postgres-and-browser:
    name: PostgreSQL and browser tests
    needs: [security, static-and-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_BASE_URL: http://127.0.0.1:8000
      DATABASE_URL: postgresql://portfolio:local-demo-password@127.0.0.1:5432/portfolio
      API_TIMEOUT_SECONDS: "5"
      ARTIFACTS_DIR: artifacts
      TEST_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install locked development dependencies
        run: uv sync --extra dev --locked --python "${PYTHON_VERSION}"

      - name: Install Playwright browsers and system dependencies
        run: uv run --frozen playwright install --with-deps chromium firefox webkit

      - name: Build and start the controlled stack
        run: docker compose up --detach --build --wait

      - name: Audit container images
        env:
          TRIVY_VERSION: "0.76.1"
          TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          for service in app database; do
            "$RUNNER_TEMP/trivy" image --scanners vuln --severity HIGH,CRITICAL \
              --exit-code 1 "$(docker compose images -q "$service")"
          done

      - name: Confirm application readiness
        run: uv run --frozen python scripts/wait_for_services.py --timeout 30

      - name: Check contracts in the installed package
        run: >-
          docker compose exec -T -w /tmp app python -c
          'from test_framework.contracts import load_schema;
          from jsonschema import Draft202012Validator;
          [Draft202012Validator.check_schema(load_schema(name))
          for name in ("order.schema.json", "error.schema.json")]'

      - name: Run service-layer tests serially
        run: >-
          uv run --frozen pytest
          tests/api tests/contract tests/database tests/integration
          -q
          --html=artifacts/service-report.html
          --self-contained-html
          --junitxml=artifacts/service-junit.xml

      - name: Prove bounded service-test parallelism
        run: >-
          uv run --frozen pytest
          -m "api or contract or database or integration"
          -q -n 2
          --junitxml=artifacts/service-parallel-junit.xml

      - name: Run focused Chromium UI and end-to-end tests
        run: >-
          uv run --frozen pytest tests/ui tests/e2e
          -q --browser chromium
          --tracing retain-on-failure
          --screenshot only-on-failure
          --video retain-on-failure
          --output artifacts/playwright/chromium
          --html=artifacts/browser-report.html
          --self-contained-html
          --junitxml=artifacts/browser-junit.xml

      - name: Run three-browser smoke coverage
        run: >-
          uv run --frozen pytest -m smoke -q
          --browser chromium --browser firefox --browser webkit
          --tracing retain-on-failure
          --screenshot only-on-failure
          --output artifacts/playwright/smoke
          --junitxml=artifacts/browser-smoke-junit.xml

      - name: Prove bounded browser-test parallelism
        run: >-
          uv run --frozen pytest tests/ui -q -n 2 --browser chromium
          --tracing retain-on-failure --screenshot only-on-failure
          --output artifacts/playwright/parallel
          --junitxml=artifacts/browser-parallel-junit.xml

      - name: Capture Compose diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps --all > artifacts/compose-ps.txt 2>&1 || true
          docker compose logs --no-color > artifacts/compose.log 2>&1 || true

      - name: Stop the controlled stack
        if: always()
        run: docker compose down

      - name: Upload service and browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-browser-evidence
          path: |
            artifacts/*-report.html
            artifacts/*-junit.xml
            artifacts/compose-ps.txt
            artifacts/compose.log
            artifacts/playwright/
            artifacts/ci-*/
          if-no-files-found: warn
          retention-days: 14
